[project]
name = "hotel-booking-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "limberg", email = "limberg.rivera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "xgboost>=3.4.1",
]

[project.scripts]
hotel-booking-ml = "hotel_booking_ml:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
# Longitud máxima recomendada por PEP 8
line-length = 79

# Cuatro espacios por nivel de indentación
indent-width = 4

# Versión de Python del proyecto
target-version = "py312"

[tool.ruff.lint]
# Reglas de estilo, errores, imports y código incorrecto
select = ["E", "W", "F", "I"]

[tool.ruff.format]
# Comillas dobles y espacios en lugar de tabulaciones
quote-style = "double"
indent-style = "space"

